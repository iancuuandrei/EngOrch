name: automation:fabric-v1-sol-supervisor

# Trusted dev pushes only. No source checkout, build, or PR code execution.
# main is a rolling major/minor view; immutable release tags are never moved.
on:
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: fabric-rolling-main
  cancel-in-progress: false

jobs:
  synchronize-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Synchronize the rolling version with an exact main lease
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # A queued superseded push must not roll source backward.
          dev_sha=$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')
          if [[ "$SOURCE_SHA" != "$dev_sha" ]]; then
            echo 'Superseded dev push; a newer push owns synchronization.'
            exit 0
          fi
          source=$(gh api "repos/$GH_REPO/git/commits/$SOURCE_SHA")
          jq -e '
            .author.name == "automation:fabric-v1-sol-supervisor" and
            .author.email == "automation@fabric.invalid" and
            .committer.name == "automation:fabric-v1-sol-supervisor" and
            .committer.email == "automation@fabric.invalid" and
            (.message | test("(?im)^Co-authored-by:") | not)
          ' <<< "$source" > /dev/null
          title=$(jq -r '.message | split("\n")[0]' <<< "$source")
          [[ "$title" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(:.*)?$ ]]
          version="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          main=$(gh api "repos/$GH_REPO/git/commits/$main_sha")
          current=$(jq -r '.message' <<< "$main")
          [[ "$current" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tree=$(jq -r '.tree.sha' <<< "$source")
          main_tree=$(jq -r '.tree.sha' <<< "$main")
          # Even a new version label creates its own checkpoint.
          if [[ "$version" == "$current" && "$tree" == "$main_tree" ]]; then
            echo 'Main already has the exact current dev tree.'
            exit 0
          fi
          if [[ "$version" != "$current" ]]; then
            [[ "$(printf '%s\n' "$current" "$version" | sort -V | tail -n 1)" == "$version" ]]
          fi
          jq -e '(.parents | length) <= 1' <<< "$main" > /dev/null
          # Bare object handling only: no source tree is executed or checked out.
          gh auth setup-git
          git init --bare "$RUNNER_TEMP/fabric-snapshot.git" > /dev/null
          cd "$RUNNER_TEMP/fabric-snapshot.git"
          git remote add origin "https://github.com/$GH_REPO.git"
          git fetch --no-tags origin refs/heads/main refs/heads/dev
          git cat-file -e "$SOURCE_SHA^{commit}"
          git cat-file -e "$main_sha^{commit}"
          [[ "$(git rev-parse "$SOURCE_SHA^{tree}")" == "$tree" ]]
          export GIT_AUTHOR_NAME='automation:fabric-v1-sol-supervisor'
          export GIT_AUTHOR_EMAIL='automation@fabric.invalid'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          parent_args=()
          if [[ "$version" == "$current" ]]; then
            # Amend only this line's checkpoint, preserving both original dates.
            export GIT_AUTHOR_DATE="$(git show -s --format=%aI "$main_sha")"
            export GIT_COMMITTER_DATE="$(git show -s --format=%cI "$main_sha")"
            parent=$(jq -r '.parents[0].sha // empty' <<< "$main")
            if [[ -n "$parent" ]]; then parent_args=(-p "$parent"); fi
          else
            # A new line gets one new snapshot and its own creation date.
            parent_args=(-p "$main_sha")
            now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            export GIT_AUTHOR_DATE="$now"
            export GIT_COMMITTER_DATE="$now"
          fi
          snapshot=$(printf '%s\n' "$version" | git commit-tree "$tree" "${parent_args[@]}")
          [[ "$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')" == "$SOURCE_SHA" ]]
          git push --force-with-lease="refs/heads/main:$main_sha" origin "$snapshot:refs/heads/main"
